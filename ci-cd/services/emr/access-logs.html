<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>접근 로그 — EMR</title>
<link rel="stylesheet" href="css/style.css">
<style>
.log-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 10.5px;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 500;
}
.lt-LOGIN  { background:rgba(30,201,122,.12); color:#4ee09a; border:1px solid rgba(30,201,122,.25); }
.lt-LOGOUT { background:rgba(74,88,120,.15);  color:var(--text-3); border:1px solid var(--border); }
.lt-VIEW_EMR { background:rgba(45,124,246,.12); color:#6aabff; border:1px solid rgba(45,124,246,.25); }
.lt-EDIT_PATIENT { background:rgba(240,165,0,.12); color:#f5c247; border:1px solid rgba(240,165,0,.25); }
.lt-CREATE_PATIENT { background:rgba(45,124,246,.12); color:#6aabff; border:1px solid rgba(45,124,246,.25); }
.lt-CREATE_RECORD { background:rgba(168,85,247,.12); color:#c084fc; border:1px solid rgba(168,85,247,.25); }

.log-filter-bar {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; align-items: center;
}
.summary-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.mini-stat {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
}
.mini-stat-icon {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.mini-stat-label { font-family: var(--mono); font-size: 10px; color: var(--text-3); text-transform:uppercase; letter-spacing:.06em; }
.mini-stat-val { font-size: 18px; font-weight: 300; }
</style>
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">접근 로그</div>
      <span class="badge badge-warn">ADMIN 전용</span>
      <button class="btn btn-ghost btn-sm ml-auto" onclick="exportLogs()">
        <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        CSV 내보내기
      </button>
    </div>

    <div class="content">

      <!-- 요약 -->
      <div class="summary-row">
        <div class="mini-stat">
          <div class="mini-stat-icon" style="background:rgba(30,201,122,.1);">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="var(--success)" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          </div>
          <div>
            <div class="mini-stat-label">로그인</div>
            <div class="mini-stat-val text-success" id="cnt-login">0</div>
          </div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-icon" style="background:rgba(45,124,246,.1);">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="var(--accent)" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
          <div>
            <div class="mini-stat-label">EMR 열람</div>
            <div class="mini-stat-val text-accent" id="cnt-view">0</div>
          </div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-icon" style="background:rgba(240,165,0,.1);">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="var(--warn)" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </div>
          <div>
            <div class="mini-stat-label">정보 수정</div>
            <div class="mini-stat-val text-warn" id="cnt-edit">0</div>
          </div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-icon" style="background:rgba(232,69,69,.1);">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="var(--danger)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
          <div>
            <div class="mini-stat-label">오류 / 경고</div>
            <div class="mini-stat-val text-danger">0</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="log-filter-bar">
          <div class="search-wrap" style="flex:1;min-width:180px;">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="searchLog" class="search-input" type="text" placeholder="사용자 ID, IP 검색..." oninput="filterLogs()">
          </div>
          <select id="actionFilter" class="form-control" style="width:130px;" onchange="filterLogs()">
            <option value="">전체 액션</option>
            <option value="LOGIN">LOGIN</option>
            <option value="LOGOUT">LOGOUT</option>
            <option value="VIEW_EMR">VIEW_EMR</option>
            <option value="EDIT_PATIENT">EDIT_PATIENT</option>
            <option value="CREATE_PATIENT">CREATE_PATIENT</option>
            <option value="CREATE_RECORD">CREATE_RECORD</option>
          </select>
          <input id="dateFilter" class="form-control" type="date" style="width:140px;" onchange="filterLogs()">
          <button class="btn btn-ghost btn-sm" onclick="clearFilters()">초기화</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>LOG ID</th>
                <th>사용자 ID</th>
                <th>액션</th>
                <th>접속 시간</th>
                <th>IP 주소</th>
              </tr>
            </thead>
            <tbody id="log-list">
              <tr><td colspan="5" class="muted" style="text-align:center;padding:28px;">데이터를 불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="flex items-center justify-between mt-16">
          <div class="text-dim fs-12 text-mono" id="log-page-info"></div>
          <div class="pagination" id="log-pagination"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script>
// ADMIN 권한 검사
requireRole('ADMIN'); 
renderSidebar('access-logs');

const PAGE_SIZE = 12;
let currentPage = 1;
let filtered = [];
let searchTimeout;

// API를 통해 실시간 접근 로그 불러오기
async function loadLogs() {
  const q  = document.getElementById('searchLog').value.trim();
  const ac = document.getElementById('actionFilter').value;
  const dt = document.getElementById('dateFilter').value;

  const params = new URLSearchParams();
  if (q) params.append('search', q);
  if (ac) params.append('action', ac);
  if (dt) params.append('date', dt);

  try {
    const res = await api.get(`/logs?${params.toString()}`);
    if (res.success) {
      filtered = res.data;
      currentPage = 1;
      updateStats();
      render();
    }
  } catch (err) {
    console.error('로그 데이터를 불러오는 데 실패했습니다.', err);
    document.getElementById('log-list').innerHTML = `<tr><td colspan="5" class="muted" style="text-align:center;padding:28px;">로그를 불러오지 못했습니다.</td></tr>`;
  }
}

// 상단 요약 통계 업데이트
function updateStats() {
  document.getElementById('cnt-login').textContent = filtered.filter(l => l.action_type === 'LOGIN').length;
  document.getElementById('cnt-view').textContent  = filtered.filter(l => l.action_type === 'VIEW_EMR').length;
  document.getElementById('cnt-edit').textContent  = filtered.filter(l => ['EDIT_PATIENT', 'CREATE_PATIENT', 'CREATE_RECORD'].includes(l.action_type)).length;
}

// 검색어 입력 시 디바운싱 처리
function filterLogs() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(loadLogs, 300);
}

// 필터 초기화
function clearFilters() {
  document.getElementById('searchLog').value = '';
  document.getElementById('actionFilter').value = '';
  document.getElementById('dateFilter').value = '';
  loadLogs();
}

// 테이블 및 페이지네이션 렌더링
function render() {
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);

  document.getElementById('log-page-info').textContent = `${total > 0 ? start + 1 : 0}–${Math.min(start + PAGE_SIZE, total)} / ${total}건`;

  document.getElementById('log-list').innerHTML = page.length ? page.map(l => `
    <tr>
      <td class="mono text-dim">#${l.log_id}</td>
      <td class="mono">USER-${l.user_id}</td>
      <td><span class="log-tag lt-${l.action_type}">${l.action_type}</span></td>
      <td class="mono">${l.access_time ? l.access_time.replace('T', ' ') : '—'}</td>
      <td class="mono muted">${l.ip_address || '—'}</td>
    </tr>
  `).join('') : `<tr><td colspan="5" class="muted" style="text-align:center;padding:28px;">검색 결과가 없습니다.</td></tr>`;

  const pag = document.getElementById('log-pagination');
  let h = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
  for (let i = 1; i <= totalPages; i++) {
    if (totalPages > 7 && Math.abs(i - currentPage) > 2 && i !== 1 && i !== totalPages) {
      if (i === 2 || i === totalPages - 1) h += `<span class="text-dim" style="padding:0 4px">…</span>`;
      continue;
    }
    h += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  h += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
  pag.innerHTML = h;
}

// 페이지 이동
function goPage(p) {
  const total = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (p < 1 || p > total) return;
  currentPage = p; 
  render();
}

// CSV 내보내기 기능
function exportLogs() {
  if (filtered.length === 0) {
    alert('내보낼 데이터가 없습니다.');
    return;
  }
  const header = 'log_id,user_id,action_type,access_time,ip_address\n';
  const rows = filtered.map(l => `${l.log_id},${l.user_id},${l.action_type},${l.access_time},${l.ip_address}`).join('\n');
  const blob = new Blob([header + rows], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `access-log-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
}

// 최초 로드 시 데이터 조회
loadLogs();
</script>
</body>
</html>
